name = "kingkazmax-portrait-api"
main = "server/portrait-api.mjs"
compatibility_date = "2026-10-23"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://kingkazmax.github.io"
IMAGE_API_BASE_URL = "https://api.openai.com/v1"
IMAGE_MODEL = "gpt-image-2"
# Set TURNSTILE_SITE_KEY after creating a widget for the website hostname.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

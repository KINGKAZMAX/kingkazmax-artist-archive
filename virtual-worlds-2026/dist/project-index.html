<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目档案</title><link rel="stylesheet" href="style.css"><main style="padding:60px 6vw"><a href="portal.html">← 世界入口</a><h2>项目，是世界的切片。</h2><p>本机与 LaCie 共检出 262 个含运行脚本的包目录，包含子项目、参考项目与历史版本；不代表全部为独立原创作品。已整合的 18 个入口见世界入口页。</p><h3>已有项目入口</h3><p><a href="https://github.com/KINGKAZMAX/OCWORLD" target="_blank">OCWORLD ↗</a></p><p><a href="https://github.com/KINGKAZMAX/OCWORLD-X" target="_blank">OCWORLD-X ↗</a></p><p><a href="https://github.com/KINGKAZMAX/Kowloon-Walled-City" target="_blank">九龙城寨 ↗</a></p><p><a href="https://kingkazmax.github.io/AdventuregameX/" target="_blank">GameX ↗</a></p><p><a href="https://KINGKAZMAX.github.io/playtime-atlas-20261021/" target="_blank">PLAYTIME ATLAS ↗</a></p><p><a href="https://github.com/KINGKAZMAX/unesco-virtual-museum-replica" target="_blank">UNESCO 虚拟博物馆复现 ↗</a></p><p><a href="https://github.com/KINGKAZMAX/alma-globe" target="_blank">ALMA 地球 ↗</a></p><p><a href="https://github.com/KINGKAZMAX/kingkazmax-artist-archive" target="_blank">作品归档 ↗</a></p><h3>本地项目索引</h3><input id="q" placeholder="筛选项目"><div id="list"></div></main><script>let rows=[];function draw(){const q=document.querySelector("#q").value.toLowerCase();document.querySelector("#list").replaceChildren(...rows.filter(r=>(r.name+r.folder).toLowerCase().includes(q)).map(r=>{const p=document.createElement("p");p.textContent=r.folder+" / "+r.name+" · "+r.location+" · "+(r.built?"检测到构建产物":"源码待构建");return p}))}fetch("project-inventory.json").then(x=>x.json()).then(x=>{rows=x;draw()});document.querySelector("#q").oninput=draw</script></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="回响电玩馆">
  <!--
    回响电玩馆 · PLAYTIME ATLAS —— 站点图标（原创）
    设计：取品牌标记的 135° 渐变（朱砂 → 浅朱砂 → 墨面）作底，
    中央以等宽字体的「回」字意象做镂空像素块，呼应「回响」。
    颜色取自 16-design-system 的 --ds-accent / --ds-bg（暗色主题口径）。
  -->
  <defs>
    <linearGradient id="atlas-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0684a"/>
      <stop offset="0.55" stop-color="#b4432b"/>
      <stop offset="1" stop-color="#1a1614"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#atlas-mark)"/>
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#f7f4f0" stroke-opacity="0.28" stroke-width="2"/>
  <g fill="#f7f4f0">
    <rect x="18" y="18" width="28" height="6" rx="2"/>
    <rect x="18" y="29" width="6" height="17" rx="2"/>
    <rect x="29" y="29" width="17" height="6" rx="2"/>
    <rect x="40" y="29" width="6" height="17" rx="2"/>
    <rect x="18" y="40" width="17" height="6" rx="2"/>
  </g>
</svg>

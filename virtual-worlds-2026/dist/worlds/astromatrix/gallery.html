<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="愛 AI 自由意志 | ASTROMATRIX · 概念设定">
<title>愛 AI 自由意志 | ASTROMATRIX · 概念设定</title>
<!--
  概念设定画廊 · 部署 agent#12/30（2026-09-13）
  5 幅概念效果图（/loading-img/concept-1..5.jpg，1200x900；01 为 ASTROMATRIX 正式海报，
  与展项加载页 /hub/loader.js 共用同一组图——本页给这批效果图一个常驻入口）。
  单文件无构建 / 无外链脚本 / 无 emoji（图标全内联 SVG）/ 深色底纯白字 / 图片 lazy loading。
  自适应 390-900px：容器 max-width 760px；顶栏 sticky + 四向安全区；返回按钮 → /portal。
  交互：点击任一图片进入全屏查看；全屏内左右滑动 / 点按两侧 / 键盘方向键切换，Esc / 返回键 /
  点背景关闭（开全屏时 pushState，移动端硬件返回先关全屏而非离开画廊）。
-->
<style>
  :root {
    --bg: #0b0e13;
    --line: rgba(255, 255, 255, 0.14);
    --line-soft: rgba(255, 255, 255, 0.08);
    --t1: #fff;
    --t2: rgba(255, 255, 255, 0.62);
    --t3: rgba(255, 255, 255, 0.40);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  html.v-open, html.v-open body { overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--t1);
    font-family: "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 静态微星云装饰（纯渐变，无动画无图片） ---------- */
  .sky {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(130% 60% at 82% -10%, rgba(255, 255, 255, 0.05), transparent 60%),
      radial-gradient(90% 55% at -12% 30%, rgba(255, 243, 222, 0.04), transparent 58%),
      radial-gradient(85% 60% at 50% 112%, rgba(255, 255, 255, 0.04), transparent 60%);
  }
  .sky::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(11, 14, 19, 0.9) 100%);
  }

  /* ---------- 布局骨架（安全区） ---------- */
  .page {
    position: relative; z-index: 1; max-width: 760px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
  }

  /* ---------- 顶栏：返回按钮 + 标题 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-bottom: 10px;
    background: rgba(11, 14, 19, 0.92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
  }
  .back {
    flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.06);
    color: var(--t1);
    border-radius: 8px;
    padding: 8px 12px;
    font: 500 12px/1 inherit; font-family: inherit;
    letter-spacing: 0.18em; text-indent: 0.18em;
    text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.25s ease;
  }
  .back:active { background: rgba(255, 255, 255, 0.14); }
  @media (hover: hover) { .back:hover { background: rgba(255, 255, 255, 0.12); } }
  .back svg { opacity: 0.8; }
  .tb-title { flex: 1; min-width: 0; text-align: center; }
  .tb-title h1 {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.14em; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tb-title h1 .tb-sep {
    font-style: normal; font-weight: 400;
    color: var(--t3); margin: 0 0.35em;
  }
  .tb-page {
    margin-top: 3px;
    font-family: var(--mono); font-size: 8.5px;
    letter-spacing: 0.42em; text-indent: 0.42em;
    color: var(--t3);
  }
  .tb-pad { flex: none; width: 74px; } /* 与返回钮等宽的占位，保持标题视觉居中 */
  @media (max-width: 459px) { .tb-pad { display: none; } }
  @media (max-width: 419px) {
    .tb-title h1 { font-size: 12px; letter-spacing: 0.1em; }
    .back { padding: 8px 10px; letter-spacing: 0.12em; text-indent: 0.12em; }
  }
  @media (max-width: 359px) { .tb-pad { display: none; } }

  /* ---------- 引导行 ---------- */
  .hint {
    margin-top: 20px;
    font-size: 11px; letter-spacing: 0.1em;
    color: var(--t2);
    display: flex; align-items: center; gap: 10px;
  }
  .hint::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), transparent);
  }

  /* ---------- 纵向大图流 ---------- */
  .fig { margin-top: 26px; }
  .fig:first-of-type { margin-top: 18px; }
  .shot {
    display: block; width: 100%;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: #05070a;
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .shot img {
    display: block; width: 100%; height: auto;
    aspect-ratio: 4 / 3; object-fit: cover;
  }
  .fig figcaption {
    margin-top: 10px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .cap-n {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--t3);
  }
  .cap-t { font-size: 12.5px; letter-spacing: 0.24em; color: var(--t2); }
  .cap-tag {
    margin-left: auto;
    font-family: var(--mono); font-size: 8.5px;
    letter-spacing: 0.24em;
    color: var(--t3);
    white-space: nowrap;
  }

  /* ---------- 底部 ---------- */
  footer {
    margin-top: 44px; padding-top: 22px;
    border-top: 1px solid var(--line-soft);
    text-align: center;
  }
  .foot-claim {
    font-size: 12px; letter-spacing: 0.22em; text-indent: 0.22em;
    color: rgba(255, 255, 255, 0.85);
  }
  .foot-sub {
    margin-top: 10px;
    font-family: var(--mono); font-size: 8.5px;
    letter-spacing: 0.4em; text-indent: 0.4em;
    color: var(--t3);
  }

  /* ---------- 全屏查看层 ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 2147483000;
    background: rgba(5, 7, 10, 0.97);
    display: flex; align-items: center; justify-content: center;
  }
  .viewer[hidden] { display: none; }
  .v-stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 52px) 10px
      calc(env(safe-area-inset-bottom, 0px) + 68px);
    cursor: zoom-out;
  }
  .v-stage img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    transition: opacity 0.18s ease;
    cursor: default;
  }
  .v-stage img.fade { opacity: 0; }
  .v-ghost {
    position: absolute; z-index: 3;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.26);
    background: rgba(255, 255, 255, 0.07);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .v-ghost:active { background: rgba(255, 255, 255, 0.18); }
  @media (hover: hover) { .v-ghost:hover { background: rgba(255, 255, 255, 0.14); } }
  .v-close { top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px); }
  .v-prev { left: calc(env(safe-area-inset-left, 0px) + 10px); top: 50%; transform: translateY(-50%); }
  .v-next { right: calc(env(safe-area-inset-right, 0px) + 10px); top: 50%; transform: translateY(-50%); }
  .v-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: linear-gradient(180deg, transparent, rgba(5, 7, 10, 0.88));
    pointer-events: none;
  }
  .v-cap { font-size: 12px; letter-spacing: 0.26em; color: rgba(255, 255, 255, 0.85); }
  .v-count {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--t3);
  }
  @media (prefers-reduced-motion: reduce) { .v-stage img { transition: none; } }
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<div class="page">

  <!-- 顶栏：返回门户 + 标题 -->
  <header class="topbar">
    <a class="back" href="index.html" aria-label="返回门户">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6"/><path d="M11 6l-6 6 6 6"/></svg>
      <span>返回</span>
    </a>
    <div class="tb-title">
      <h1>愛 AI 自由意志<i class="tb-sep">|</i>ASTROMATRIX</h1>
      <p class="tb-page">概念设定 · CONCEPT ART</p>
    </div>
    <span class="tb-pad" aria-hidden="true"></span>
  </header>

  <p class="hint">五幅概念效果图 · 01 为正式海报 · 点击图片全屏查看，左右滑动切换</p>

  <main id="figs">
    <figure class="fig">
      <a class="shot" href="loading-img/concept-1.jpg" target="_blank" rel="noopener" aria-label="设定图 1 · 点击全屏查看">
        <img src="loading-img/concept-1.jpg" alt="设定图 1 · ASTROMATRIX 概念效果图（正式海报）" width="1200" height="900" decoding="async" fetchpriority="high">
      </a>
      <figcaption>
        <span class="cap-n">01</span>
        <span class="cap-t">设定图 1</span>
        <span class="cap-tag">CONCEPT 1 / 5</span>
      </figcaption>
    </figure>

    <figure class="fig">
      <a class="shot" href="loading-img/concept-2.jpg" target="_blank" rel="noopener" aria-label="设定图 2 · 点击全屏查看">
        <img src="loading-img/concept-2.jpg" alt="设定图 2 · ASTROMATRIX 概念效果图" width="1200" height="900" loading="lazy" decoding="async">
      </a>
      <figcaption>
        <span class="cap-n">02</span>
        <span class="cap-t">设定图 2</span>
        <span class="cap-tag">CONCEPT 2 / 5</span>
      </figcaption>
    </figure>

    <figure class="fig">
      <a class="shot" href="loading-img/concept-3.jpg" target="_blank" rel="noopener" aria-label="设定图 3 · 点击全屏查看">
        <img src="loading-img/concept-3.jpg" alt="设定图 3 · ASTROMATRIX 概念效果图" width="1200" height="900" loading="lazy" decoding="async">
      </a>
      <figcaption>
        <span class="cap-n">03</span>
        <span class="cap-t">设定图 3</span>
        <span class="cap-tag">CONCEPT 3 / 5</span>
      </figcaption>
    </figure>

    <figure class="fig">
      <a class="shot" href="loading-img/concept-4.jpg" target="_blank" rel="noopener" aria-label="设定图 4 · 点击全屏查看">
        <img src="loading-img/concept-4.jpg" alt="设定图 4 · ASTROMATRIX 概念效果图" width="1200" height="900" loading="lazy" decoding="async">
      </a>
      <figcaption>
        <span class="cap-n">04</span>
        <span class="cap-t">设定图 4</span>
        <span class="cap-tag">CONCEPT 4 / 5</span>
      </figcaption>
    </figure>

    <figure class="fig">
      <a class="shot" href="loading-img/concept-5.jpg" target="_blank" rel="noopener" aria-label="设定图 5 · 点击全屏查看">
        <img src="loading-img/concept-5.jpg" alt="设定图 5 · ASTROMATRIX 概念效果图" width="1200" height="900" loading="lazy" decoding="async">
      </a>
      <figcaption>
        <span class="cap-n">05</span>
        <span class="cap-t">设定图 5</span>
        <span class="cap-tag">CONCEPT 5 / 5</span>
      </figcaption>
    </figure>
  </main>

  <footer>
    <p class="foot-claim">愛 AI 自由意志 ASTROMATRIX</p>
    <p class="foot-sub">CONCEPT ART · COMMON FIELD · MOBILE COSMOS</p>
  </footer>

</div>

<!-- 全屏查看层（点击图片打开；左右滑动 / 两侧按钮 / 方向键切换；Esc / 返回键 / 点背景关闭） -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="概念图全屏查看">
  <div class="v-stage" id="v-stage">
    <img id="v-img" alt="设定图全屏" decoding="async">
  </div>
  <button class="v-ghost v-close" id="v-close" type="button" aria-label="关闭全屏">
    <svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
  </button>
  <button class="v-ghost v-prev" id="v-prev" type="button" aria-label="上一张">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="v-ghost v-next" id="v-next" type="button" aria-label="下一张">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="v-bar">
    <span class="v-cap" id="v-cap">设定图 1</span>
    <span class="v-count" id="v-count">1 / 5</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var N = 5;
  var viewer = document.getElementById('viewer');
  var vImg = document.getElementById('v-img');
  var vCap = document.getElementById('v-cap');
  var vCount = document.getElementById('v-count');
  var cur = -1;
  var histPushed = false;

  function srcOf(i) { return 'loading-img/concept-' + (i + 1) + '.jpg'; }
  function wrap(i) { return i < 0 ? N - 1 : i >= N ? 0 : i; } /* 循环切换 */
  function preload(i) { try { var im = new Image(); im.src = srcOf(wrap(i)); } catch (e) {} }

  function show(i) {
    i = wrap(i);
    cur = i;
    vCap.textContent = '设定图 ' + (i + 1);
    vCount.textContent = (i + 1) + ' / ' + N;
    vImg.alt = '设定图 ' + (i + 1) + ' · 全屏';
    var done = false;
    function reveal() {
      if (done) return;
      done = true;
      if (cur === i) vImg.classList.remove('fade');
    }
    vImg.onload = reveal;
    vImg.classList.add('fade');
    vImg.src = srcOf(i);
    if (vImg.complete && vImg.naturalWidth > 0) reveal(); /* 缓存命中不触发 load */
    preload(i + 1);
    preload(i - 1);
  }

  function openViewer(i) {
    if (!viewer.hidden) { show(i); return; }
    viewer.hidden = false;
    document.documentElement.classList.add('v-open');
    show(i);
    try { history.pushState({ cfGalleryViewer: 1 }, ''); histPushed = true; } catch (e) {}
  }

  function closeViewer(fromPop) {
    if (viewer.hidden) return;
    viewer.hidden = true;
    document.documentElement.classList.remove('v-open');
    vImg.onload = null;
    var needBack = histPushed && !fromPop;
    histPushed = false;
    if (needBack) { try { history.back(); } catch (e) {} } /* 抵消 pushState，返回键语义保持「回门户」 */
  }

  /* 硬件返回 / 历史导航：先关全屏 */
  window.addEventListener('popstate', function () { closeViewer(true); });
  window.addEventListener('pagehide', function () { histPushed = false; });

  /* 图片卡点击 → 全屏（无 JS 时降级为新标签页开原图） */
  var shots = document.querySelectorAll('.shot');
  Array.prototype.forEach.call(shots, function (a, i) {
    a.addEventListener('click', function (e) { e.preventDefault(); openViewer(i); });
  });

  /* 全屏层控件 */
  document.getElementById('v-close').addEventListener('click', function () { closeViewer(false); });
  document.getElementById('v-prev').addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
  document.getElementById('v-next').addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });
  vImg.addEventListener('click', function (e) { e.stopPropagation(); }); /* 点图本体不误关 */
  document.getElementById('v-stage').addEventListener('click', function () { closeViewer(false); }); /* 点背景关闭 */

  /* 键盘（桌面）：Esc 关闭 / 左右切换 */
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer(false);
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === 'ArrowRight') show(cur + 1);
  });

  /* 触摸滑动切换（单指水平滑，阈值 48px，须显著大于纵向位移；500ms 内的快滑才算） */
  var tx = null, ty = 0, tt = 0;
  viewer.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
  }, { passive: true });
  viewer.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    tx = null;
    if (Date.now() - tt > 500) return;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2) show(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });
})();
</script>
</body>
</html>

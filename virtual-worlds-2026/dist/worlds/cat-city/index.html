<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1418" />
    <meta name="description" content="旅行喵喵冒险记 — 原创二维像素小猫探索游戏" />
    <title>旅行喵喵冒险记</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23F2D99A'/%3E%3Cpath d='M4 6h2V4h1v2h2V4h1v2h2v5H4z' fill='%23E39A58'/%3E%3Crect x='5' y='8' width='2' height='2' fill='%23302329'/%3E%3Crect x='9' y='8' width='2' height='2' fill='%23302329'/%3E%3Crect x='7' y='10' width='2' height='1' fill='%23C96B67'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-hzg60YlU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DP_n-JgL.css">
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" width="480" height="320" aria-label="游戏画面"></canvas>


        <div id="dialogue" class="hidden" role="dialog" aria-live="polite">
          <div id="dialogue-name">桂婆婆</div>
          <div id="dialogue-text"></div>
          <div id="dialogue-next">▼</div>
        </div>

        <div id="toast" class="hidden"></div>





      </div>

      <div id="hud" class="hidden">
        <div id="hud-left">
          <div id="hud-zone">暖阳小镇</div>
          <div id="hud-quest">……</div>
          <canvas id="minimap" width="196" height="136" aria-label="小地图"></canvas>
        </div>
        <div id="hud-right">
          <button id="btn-journal" class="hud-btn" type="button" aria-label="手记">手记</button>
          <button id="btn-map" class="hud-btn" type="button" aria-label="地图">地图</button>
          <button id="btn-mute" class="hud-btn" type="button" aria-label="声音开关">♪</button>
          <button id="btn-pause" class="hud-btn" type="button" aria-label="暂停">❚❚</button>
        </div>
      </div>

      <div id="touch" class="hidden" aria-hidden="true">
        <div id="dpad" role="group" aria-label="方向键">
          <button class="dbtn dcorner" data-dir="up-left" type="button" aria-label="左上"></button>
          <button class="dbtn" data-dir="up" type="button" aria-label="上"></button>
          <button class="dbtn dcorner" data-dir="up-right" type="button" aria-label="右上"></button>
          <button class="dbtn" data-dir="left" type="button" aria-label="左"></button>
          <button class="dbtn dmid" data-dir="none" type="button" aria-label="停止" disabled></button>
          <button class="dbtn" data-dir="right" type="button" aria-label="右"></button>
          <button class="dbtn dcorner" data-dir="down-left" type="button" aria-label="左下"></button>
          <button class="dbtn" data-dir="down" type="button" aria-label="下"></button>
          <button class="dbtn dcorner" data-dir="down-right" type="button" aria-label="右下"></button>
        </div>
        <div id="tbtns">
          <button class="tbtn" data-act="journal" type="button">手记</button>
          <button class="tbtn" data-act="map" type="button">地图</button>
          <button class="tbtn" data-act="mute" type="button">音乐</button>
          <button class="tbtn" data-act="pause" type="button">暂停</button>
          <button class="tbtn tbig" data-act="interact" type="button">互动</button>
        </div>
      </div>
    </div>

    <div id="title" class="overlay">
      <div class="title-box">
        <h1>旅行喵喵冒险记</h1>
        <p class="subtitle">栗团的午后</p>
        <p class="tagline">一只橘白小猫，三个相连的地方，一段温柔的路。</p>
        <div class="btn-row">
          <button id="btn-continue" class="big-btn" type="button">继续旅程</button>
          <button id="btn-new" class="big-btn" type="button">新的旅程</button>
        </div>
        <div class="hint">
          <p><b>键盘</b>：方向键 / WASD 移动 · E 或 空格 互动 · J 手记 · M 地图 · N 静音 · F 全屏 · Esc 暂停</p>
          <p><b>手机</b>：左下方向键移动，右下按钮互动 / 手记 / 地图 / 音乐 / 暂停</p>
        </div>
        <p id="title-note" class="note"></p>
      </div>
    </div>

    <div id="journal" class="overlay hidden">
      <div class="panel-box wide">
        <div class="panel-head">
          <h2>手记</h2>
          <button id="btn-journal-close" class="small-btn" type="button">关闭</button>
        </div>
        <div id="journal-body"></div>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel-box">
        <div class="panel-head"><h2>暂停</h2></div>
        <div class="btn-col">
          <button id="btn-resume" class="big-btn" type="button">继续</button>
          <button id="btn-save" class="big-btn" type="button">保存进度</button>
          <button id="btn-sound" class="big-btn" type="button">声音：开</button>
          <button id="btn-to-title" class="big-btn" type="button">回到标题</button>
          <button id="btn-restart" class="big-btn danger" type="button">重开新游戏</button>
        </div>
        <p class="note">重开会清空当前存档并从咖啡店前重新开始。</p>
      </div>
    </div>

    <div id="ending" class="overlay hidden">
      <div class="panel-box">
        <h2 class="ending-title">结局 · 钟塔的午后</h2>
        <div id="ending-text"></div>
        <div class="btn-row">
          <button id="btn-roam" class="big-btn" type="button">继续漫游</button>
        </div>
      </div>
    </div>
  </body>
</html>

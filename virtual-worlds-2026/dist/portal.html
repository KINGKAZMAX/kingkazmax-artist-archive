<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界入口 / 蔡智鑫</title><link rel="stylesheet" href="style.css"><style>body{background:#08090b}.portal{padding:120px 5vw 60px;max-width:1800px;margin:auto}h1{font-size:clamp(60px,10vw,160px);line-height:.95;margin:30px 0}h1 span{color:#ff304a}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:38px 0}.bar input{flex:1;min-width:220px}.worldgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid #303039;background:#101115;display:flex;flex-direction:column;overflow:hidden}.visual{height:210px;background:radial-gradient(ellipse at 60% 35%,#882033,transparent 60%),linear-gradient(140deg,#0a0b10,#28202b);position:relative;overflow:hidden;display:grid;place-items:center}.visual:before{content:'';width:150px;height:150px;border:1px solid #ff304a;transform:rotate(35deg);box-shadow:30px 20px 0 #ff304a20,-30px -20px 0 #ff304a10}.visual span{position:absolute;font:italic 90px Georgia;color:#ff6477;mix-blend-mode:screen}.card:nth-child(3n) .visual:before{border-radius:50%;transform:rotate(-20deg)}.card:nth-child(2n) .visual:before{width:220px;height:80px;transform:perspective(300px) rotateX(45deg) rotateZ(-20deg)}.card img{width:100%;height:210px;object-fit:cover}.content{padding:24px;display:flex;flex-direction:column;flex:1}.content h3{font-size:26px;margin:16px 0}.content p{color:#aaaab6;font-size:15px;line-height:1.8;flex:1}.meta{font:12px monospace;letter-spacing:1px;color:#ff6477}.content a{margin-top:18px}.overlay{position:fixed;inset:0;background:#08090b;z-index:100;display:flex;flex-direction:column}.overlay[hidden]{display:none}.playerbar{display:flex;gap:16px;align-items:center;padding:10px 20px;border-bottom:1px solid #333}.playerbar b{flex:1}.overlay iframe{flex:1;width:100%;border:0;background:#050505}.status{font-size:13px;color:#aaa}footer{margin-top:70px}button.active{background:#ff304a;color:#090909}@media(max-width:1000px){.worldgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.worldgrid{grid-template-columns:1fr}.portal{padding-top:90px}.playerbar{flex-wrap:wrap}.playerbar b{width:100%}}</style><body><nav><a class="logo" href="index.html">蔡智鑫 / KINGKAZMAX</a><div><a href="index.html#talk">汇报</a><a href="research.html">研究库</a></div></nav><main class="portal"><div class="eyebrow">VIRTUAL WHAT? / ENTERABLE WORLDS</div><h1>去往<br><span>另一个世界。</span></h1><p>角色因相遇而存在。空间因行动而发生。<br>将设计、代码与游玩，编织成可以进入的现场。</p><div class="bar"><input id="search" aria-label="搜索世界" placeholder="搜索卡带、开放世界、角色、展厅…"><button class="active" data-filter="全部">全部</button><button data-filter="游戏">游戏</button><button data-filter="空间">空间</button><button data-filter="展厅">展厅</button><button data-filter="开源复现">开源复现</button></div><p id="count" class="status"></p><div id="grid" class="worldgrid"></div><footer>虚拟何为：AI 时代的角色、空间与世界建构<br><a href="project-index.html">项目盘点与外部入口 ↗</a> · <a href="notices.html">项目说明</a></footer></main><div class="overlay" id="player" hidden><div class="playerbar"><button id="close">← 返回世界入口</button><b id="playing"></b><a id="newtab" target="_blank" rel="noopener">独立打开 ↗</a><button id="fullscreen">全屏</button></div><iframe id="game" title="交互世界" allow="fullscreen; autoplay; gamepad; xr-spatial-tracking" allowfullscreen></iframe></div><script>
let entries=[],filter='全部';const $=s=>document.querySelector(s);const escape=s=>s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function draw(){const q=$('#search').value.toLowerCase();const rows=entries.filter(x=>(filter==='全部'||x.category===filter)&&(x.title+x.description).toLowerCase().includes(q));$('#count').textContent=rows.length+' 个世界 / 点击进入 · 按需加载';$('#grid').innerHTML=rows.map((x,i)=>`<article class="card">${x.image?`<img src="${escape(x.image)}" alt="${escape(x.title)}" loading="lazy">`:`<div class="visual"><span>${String(entries.indexOf(x)+1).padStart(2,'0')}</span></div>`}<div class="content"><div class="meta">${escape(x.category)} / ${x.size} MB</div><h3>${escape(x.title)}</h3><p>${escape(x.description)}</p><button data-play="${x.id}">进入世界 ↗</button><a href="${x.url}" target="_blank" rel="noopener">独立窗口</a></div></article>`).join('');document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openWorld(b.dataset.play))}function openWorld(id){const x=entries.find(x=>x.id===id);if(!x)return;$('#playing').textContent=x.title;$('#newtab').href=x.url;$('#game').src=x.url;$('#player').hidden=false;document.body.style.overflow='hidden';history.replaceState(null,'','#'+id)}$('#close').onclick=()=>{$('#game').src='about:blank';$('#player').hidden=true;document.body.style.overflow='';history.replaceState(null,'',location.pathname)};$('#fullscreen').onclick=()=>$('#player').requestFullscreen();$('#search').oninput=draw;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});fetch('worlds.json').then(x=>x.json()).then(x=>{entries=x;draw();if(location.hash)openWorld(location.hash.slice(1))});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#player').hidden)$('#close').click()});
</script></body></html>
